<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Lite Translate - PDF 阅读翻译</title>
  <link rel="stylesheet" href="/src/styles/pdf_viewer.css">
</head>
<body>
  <div class="viewer-layout">
    <!-- Premium Top Toolbar -->
    <header class="viewer-toolbar">
      <div class="toolbar-left">
        <img src="/icons/icon.svg" class="toolbar-logo" alt="logo">
        <span class="file-name" id="pdf-title">请选择或拖入 PDF 文件...</span>
      </div>
      <div class="toolbar-center">
        <button id="prev-page" class="toolbar-btn" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="page-indicator">
          <input type="number" id="page-num" value="1" min="1" class="page-input"> / <span id="page-count">0</span>
        </span>
        <button id="next-page" class="toolbar-btn" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <div class="divider"></div>
        <button id="zoom-out" class="toolbar-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <span id="zoom-value" class="zoom-text">100%</span>
        <button id="zoom-in" class="toolbar-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
      <div class="toolbar-right">
        <label for="file-input" class="ios-button secondary-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          打开 PDF
        </label>
        <input type="file" id="file-input" accept=".pdf" class="hidden-input">
      </div>
    </header>

    <!-- PDF Canvas Container -->
    <main class="viewer-main" id="viewer-main">
      <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-box">
          <div class="welcome-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line><line x1="9" y1="11" x2="15" y2="11"></line><line x1="9" y1="19" x2="13" y2="19"></line></svg>
          </div>
          <h2>开启智能阅读翻译</h2>
          <p>请点击右上角按钮打开本地 PDF 文件，或者将 PDF 拖曳至此。我们将自动为您提取文本并开启划词翻译功能。</p>
        </div>
      </div>
      <div id="pdf-viewer-container" class="pdf-viewer-container hidden">
        <!-- Rendered pages will be appended here -->
      </div>
      <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loading-status">正在加载 PDF 文件...</p>
      </div>
    </main>
  </div>
  <script type="module" src="/src/pdf_viewer.js"></script>
</body>
</html>
