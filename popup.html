<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Lite Translate</title>
  <link rel="stylesheet" href="/src/styles/popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <img src="/icons/icon.svg" class="logo-icon" alt="logo">
        <span class="logo-text">Lite Translate</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <button class="pdf-nav-btn" id="pdf-nav-btn" title="打开 PDF 文档沉浸式对照翻译">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>PDF 翻译</span>
        </button>
        <button class="settings-btn" id="settings-btn" title="设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Native PDF Warning Overlay -->
    <div id="pdf-warning-card" class="result-card hidden" style="text-align: center; padding: 24px 16px; min-height: auto; background: rgba(255, 255, 255, 0.85);">
      <div style="color: #007AFF; margin-bottom: 12px; display: flex; justify-content: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      </div>
      <h3 style="margin: 0 0 8px 0; font-size: 15.5px; font-weight: 600;">在阅读器中打开</h3>
      <p style="font-size: 12.5px; color: #8e8e93; line-height: 1.4; margin: 0 0 16px 0;">当前页面是一个 PDF 文件。请使用内置阅读器开启流畅阅读与划词翻译：</p>
      <button id="open-pdf-btn" style="border: none; outline: none; padding: 10px; border-radius: 10px; font-size: 13.5px; font-weight: 600; background: linear-gradient(135deg, #0A84FF, #5E5CE6); color: white; cursor: pointer; width: 100%; display: block; box-shadow: 0 4px 12px rgba(9, 132, 255, 0.2);">使用扩展打开并翻译</button>
    </div>

    <!-- Main Workspace -->
    <main class="app-main" id="workspace-main">
      <div class="input-card">
        <textarea id="source-text" placeholder="输入要翻译的文本..." rows="3"></textarea>
        <button id="clear-btn" class="clear-btn hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Controls Row -->
      <div class="controls-card">
        <select id="src-lang" class="ios-select">
          <option value="auto">自动检测</option>
          <option value="en">英语</option>
          <option value="zh-CN">中文(简体)</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
        </select>
        
        <button id="swap-lang-btn" class="swap-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 11l4-4-4-4M3 7h18M7 13l-4 4 4 4M21 17H3"/></svg>
        </button>

        <select id="tgt-lang" class="ios-select">
          <option value="zh-CN">中文(简体)</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
        </select>

        <select id="engine-select" class="ios-select accent-select">
          <option value="google">Google</option>
        </select>
      </div>

      <!-- Model Select Row -->
      <div id="model-select-container" class="model-select-row hidden">
        <span class="model-select-label">模型版本:</span>
        <select id="model-select" class="ios-select model-select-input"></select>
      </div>

      <!-- Result Card -->
      <div class="result-card">
        <div class="result-header">
          <span class="engine-badge" id="current-engine-badge">Google</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <button id="speak-src-btn" class="icon-btn" title="朗读原文">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
            <button id="speak-res-btn" class="icon-btn" title="朗读译文">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </button>
            <button id="copy-btn" class="icon-btn" title="复制译文">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
        </div>
        <div class="result-content-wrapper">
          <div id="result-text" class="result-placeholder">翻译结果将在此显示...</div>
          <div id="loading-spinner" class="spinner hidden"></div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/popup.js"></script>
</body>
</html>
