<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- iOS style gradient from Apple Blue to Violet -->
    <linearGradient id="ios-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Squircle (iOS shape) -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#ios-gradient)" />
  <!-- Minimalist Translation Symbol 'A' and Chinese character '译' -->
  <g transform="translate(24, 24)" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Stylized 'A' representation for English -->
    <path d="M16 56 L32 16 L48 56" />
    <path d="M22 42 L42 42" />
    
    <!-- Stylized '译' representation for translation -->
    <path d="M58 20 L76 20" />
    <path d="M67 20 L67 52 C67 56, 63 56, 58 56" />
    <path d="M54 36 L78 36" />
  </g>
</svg>
